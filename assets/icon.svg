<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0077B6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0091EA" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bottomFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0077B6" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor Squircle Moderno FLOYDIA V6 -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="2.5"/>

  <!-- Constelación y Cristal Central -->
  <g transform="translate(128, 128) scale(0.42) translate(-256, -256)">
    <g stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
      <line x1="256" y1="70" x2="256" y2="120"/>
      <line x1="256" y1="375" x2="256" y2="435"/>
      <line x1="45" y1="256" x2="170" y2="256"/>
      <line x1="342" y1="256" x2="467" y2="256"/>
      <line x1="108" y1="108" x2="200" y2="200"/>
      <line x1="404" y1="108" x2="312" y2="200"/>
      <line x1="120" y1="390" x2="195" y2="325"/>
      <line x1="392" y1="390" x2="317" y2="325"/>
    </g>

    <polygon points="256,120 160,325 256,245" fill="url(#leftFacet)" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="256,120 352,325 256,245" fill="url(#rightFacet)" stroke="#1E3A5F" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="160,325 352,325 256,245" fill="url(#bottomFacet)" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>

    <line x1="256" y1="120" x2="256" y2="245" stroke="#E0F7FA" stroke-width="2.5" opacity="0.9"/>
    <line x1="160" y1="325" x2="256" y2="245" stroke="#E0F7FA" stroke-width="2" opacity="0.8"/>
    <line x1="352" y1="325" x2="256" y2="245" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>

    <g filter="url(#glow)">
      <circle cx="256" cy="70" r="9" fill="#00E5FF"/>
      <circle cx="256" cy="435" r="9" fill="#00E5FF"/>
      <circle cx="45" cy="256" r="9" fill="#00E5FF"/>
      <circle cx="467" cy="256" r="8" fill="#00E5FF"/>
      <circle cx="108" cy="108" r="8" fill="#00E5FF"/>
      <circle cx="404" cy="108" r="8" fill="#00E5FF"/>
      <circle cx="120" cy="390" r="8" fill="#00E5FF"/>
      <circle cx="392" cy="390" r="8" fill="#00E5FF"/>
    </g>
    <circle cx="256" cy="70" r="4" fill="#FFFFFF"/>
    <circle cx="256" cy="435" r="4" fill="#FFFFFF"/>
    <circle cx="45" cy="256" r="4" fill="#FFFFFF"/>
    <circle cx="467" cy="256" r="4" fill="#FFFFFF"/>
    <circle cx="108" cy="108" r="3.5" fill="#FFFFFF"/>
    <circle cx="404" cy="108" r="3.5" fill="#FFFFFF"/>
    <circle cx="120" cy="390" r="3.5" fill="#FFFFFF"/>
    <circle cx="392" cy="390" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>