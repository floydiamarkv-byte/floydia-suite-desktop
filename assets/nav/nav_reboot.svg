<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradReboot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
    <filter id="shadowReboot" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Apple Style Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#gradReboot)" filter="url(#shadowReboot)"/>
  <!-- Inner Border Highlight -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <!-- SF Symbol: Restart / Server Cycle -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 16 A 7 7 0 1 1 21.5 20"/>
    <polyline points="22 15 22 20.5 16.5 20.5"/>
  </g>
  <circle cx="16" cy="16" r="1.8" fill="#FFFFFF"/>
</svg>
