<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#64D2FF"/>
    </linearGradient>
    <filter id="shadowRadar" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#gradRadar)" filter="url(#shadowRadar)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <!-- SF Symbol: Radar Beam & Concentric Waves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="9" stroke-width="1.8" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="5" stroke-width="2"/>
    <circle cx="16" cy="16" r="2" fill="#FFFFFF"/>
    <line x1="16" y1="16" x2="22.5" y2="9.5" stroke-width="2.2"/>
  </g>
</svg>
