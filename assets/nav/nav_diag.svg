<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30B0C7"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
    <filter id="shadowDiag" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#gradDiag)" filter="url(#shadowDiag)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <!-- SF Symbol: Network Topology Nodes -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="11" x2="10" y2="21" stroke-width="2"/>
    <line x1="16" y1="11" x2="22" y2="21" stroke-width="2"/>
    <line x1="10" y1="21" x2="22" y2="21" stroke-width="2"/>
    <circle cx="16" cy="11" r="3.5" fill="#FFFFFF" stroke-width="1"/>
    <circle cx="10" cy="21" r="3.5" fill="#FFFFFF" stroke-width="1"/>
    <circle cx="22" cy="21" r="3.5" fill="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
