<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0091EA" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bottomFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0077B6" stop-opacity="1"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Lineas de Constelacion con Resplandor Neón FLOYDIA V6 -->
  <g stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)">
    <line x1="256" y1="70" x2="256" y2="120"/>
    <line x1="256" y1="375" x2="256" y2="435"/>
    <line x1="45" y1="256" x2="170" y2="256"/>
    <line x1="342" y1="256" x2="467" y2="256"/>
    <line x1="108" y1="108" x2="200" y2="200"/>
    <line x1="404" y1="108" x2="312" y2="200"/>
    <line x1="120" y1="390" x2="195" y2="325"/>
    <line x1="392" y1="390" x2="317" y2="325"/>
  </g>

  <!-- Prisma de Cristal Central 3D -->
  <!-- Cara Izquierda (Cian Neón Radiante) -->
  <polygon points="256,120 160,325 256,245" fill="url(#leftFacet)" stroke="#00E5FF" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Cara Derecha (Azul Profundo Obsidiana con Borde Neón Sutil) -->
  <polygon points="256,120 352,325 256,245" fill="url(#rightFacet)" stroke="#1E3A5F" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Cara Inferior (Azul Eléctrico Brillante) -->
  <polygon points="160,325 352,325 256,245" fill="url(#bottomFacet)" stroke="#00E5FF" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Aristas interiores de refracción -->
  <line x1="256" y1="120" x2="256" y2="245" stroke="#E0F7FA" stroke-width="2" opacity="0.9"/>
  <line x1="160" y1="325" x2="256" y2="245" stroke="#E0F7FA" stroke-width="1.8" opacity="0.8"/>
  <line x1="352" y1="325" x2="256" y2="245" stroke="#00E5FF" stroke-width="1.8" opacity="0.7"/>

  <!-- Nodos de Constelacion (Cian Neon con centro brillante) -->
  <g filter="url(#neonGlow)">
    <circle cx="256" cy="70" r="8.5" fill="#00E5FF"/>
    <circle cx="256" cy="435" r="8.5" fill="#00E5FF"/>
    <circle cx="45" cy="256" r="8.5" fill="#00E5FF"/>
    <circle cx="467" cy="256" r="8.5" fill="#00E5FF"/>
    <circle cx="108" cy="108" r="7.5" fill="#00E5FF"/>
    <circle cx="404" cy="108" r="7.5" fill="#00E5FF"/>
    <circle cx="120" cy="390" r="7.5" fill="#00E5FF"/>
    <circle cx="392" cy="390" r="7.5" fill="#00E5FF"/>
  </g>
  <!-- Núcleos centrales nítidos -->
  <circle cx="256" cy="70" r="3.5" fill="#FFFFFF"/>
  <circle cx="256" cy="435" r="3.5" fill="#FFFFFF"/>
  <circle cx="45" cy="256" r="3.5" fill="#FFFFFF"/>
  <circle cx="467" cy="256" r="3.5" fill="#FFFFFF"/>
  <circle cx="108" cy="108" r="3" fill="#FFFFFF"/>
  <circle cx="404" cy="108" r="3" fill="#FFFFFF"/>
  <circle cx="120" cy="390" r="3" fill="#FFFFFF"/>
  <circle cx="392" cy="390" r="3" fill="#FFFFFF"/>
</svg>