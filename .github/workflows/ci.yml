name: CI — FloydIA Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de runtime y dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # PyQt6 necesita las librerias de sistema de Qt/EGL incluso en modo offscreen.
      # Sin ellas: ImportError: libEGL.so.1 -> INTERNALERROR de pytest (exit 3).
      # Instalacion best-effort por paquete: los nombres varian entre versiones de
      # Ubuntu (libxcb-util0 -> libxcb-util1, libglib2.0-0 -> libglib2.0-0t64) y un
      # nombre inexistente no debe tumbar el job; la verificacion real es el pytest.
      - name: Dependencias de sistema para PyQt6 (headless)
        run: |
          sudo apt-get update
          for p in libegl1 libgl1 libglib2.0-0t64 libglib2.0-0 \
                   libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
                   libfontconfig1 libfreetype6 libx11-6 libx11-xcb1 \
                   libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
                   libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                   libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
                   libxcb-sync1 libxcb-util1 libxcb-util0 libxcb-xinerama0 \
                   libxcb-xkb1; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::notice::paquete no disponible en esta imagen: $p"
          done
          ldconfig -p | grep -E "libEGL\.so\.1|libGL\.so\.1" | head -2 || true

      - name: Compilación (py_compile)
        run: python -m py_compile floydia_suite_app.py theme.py modules/*.py

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
          FLOYDIA_TELEMETRY_DB: /tmp/floydia-ci/telemetry.db
        run: python -m pytest tests/ -v --tb=short

      - name: "Guard: sin rutas absolutas de usuario (codigo de produccion)"
        run: |
          if git grep -nE '/home/[A-Za-z0-9_.-]+/|Dropbox/ANTIGRAVITY_PROJECTS' -- modules/ theme.py floydia_suite_app.py; then
            echo "::error::Rutas absolutas de usuario en código de producción. Usa modules/_paths.py (FLOYDIA_WORKSPACE + upward search)."
            exit 1
          fi

      - name: Validar scripts shell
        run: bash -n install.sh run.sh packaging/make_appimage.sh && bash -n packaging/make_appimage.sh

      - name: Sintaxis PKGBUILD (bash)
        run: 'bash -n packaging/PKGBUILD 2>/dev/null || echo "SKIP: PKGBUILD usa sintaxis makepkg (no bash plano)"'

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
